<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dashboard</title>
<style>
/* ============================================================
   LAIN DASHBOARD — style.css
   Estética: Serial Experiments Lain + Y2K/terminal + Aero sutil
   ============================================================ */

:root{
  --bg: #0c0d0e;
  --fg: #e9e6df;
  --fg-dim: #9a978f;
  --red: #7d3230;      /* tom da jaqueta dela */
  --amber: #d99a52;    /* tom do cabelo dela */
  --glass: rgba(18, 17, 16, 0.34);
  --glass-border: rgba(233, 230, 223, 0.14);
  --focus-glow: rgba(217, 154, 82, 0.55);

  --gap: clamp(10px, 1.4vw, 22px);
  --pad: clamp(10px, 1.2vw, 18px);
  --fs-clock: clamp(22px, 3.2vw, 44px);
  --fs-label: clamp(12px, 1.1vw, 16px);
  --fs-small: clamp(10px, 0.9vw, 13px);

  --dur: 220ms;
}

@media (prefers-reduced-motion: reduce){
  :root{ --dur: 0ms; }
}

*{ box-sizing: border-box; }

html, body{
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: ui-monospace, "Cascadia Code", "Consolas", "SFMono-Regular", "Courier New", monospace;
  overflow: hidden; /* dashboard de TV: sem scroll */
}

/* ---------- Wallpaper ---------- */

#wallpaper-layer{
  position: fixed;
  inset: 0;
  z-index: 0;
  background-color: #050506;
  background-image: var(--wallpaper-url, none);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  filter: saturate(1.02);
}

#vignette{
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    radial-gradient(120% 120% at 50% 50%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.42) 100%),
    linear-gradient(to bottom, rgba(0,0,0,0.28) 0%, rgba(0,0,0,0) 18%, rgba(0,0,0,0) 78%, rgba(0,0,0,0.34) 100%);
}

/* leve textura de scanline, quase imperceptível */
#scanlines{
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  opacity: 0.05;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,0.6) 0px,
    rgba(255,255,255,0.6) 1px,
    transparent 1px,
    transparent 3px
  );
  mix-blend-mode: overlay;
}

/* ---------- Camada de interface ---------- */

#stage{
  position: relative;
  z-index: 3;
  width: 100vw;
  height: 100vh;
  padding: clamp(24px, 4vh, 64px) clamp(24px, 4vw, 72px);
  opacity: 0;
  animation: rise 900ms ease-out forwards;
  animation-delay: 120ms;
}

@media (prefers-reduced-motion: reduce){
  #stage{ opacity: 1; animation: none; }
}

@keyframes rise{
  from{ opacity: 0; transform: translateY(6px); }
  to{ opacity: 1; transform: translateY(0); }
}

.node{
  position: absolute;
}

/* painel translúcido base — usado com moderação */
.panel{
  background: var(--glass);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  border-radius: 3px;
}

/* ---------- Relógio ----------
   Fica na coluna direita, na faixa vazia acima do texto
   "Close the world, open the next" do wallpaper. */

#clock-node{
  top: 9vh;
  left: 76vw;
}

#clock{
  font-size: var(--fs-clock);
  font-weight: 500;
  letter-spacing: 0.02em;
  color: var(--fg);
  line-height: 1;
  text-shadow: 0 0 18px rgba(233,230,223,0.18);
}

#date{
  margin-top: 6px;
  font-size: var(--fs-small);
  color: var(--fg-dim);
  letter-spacing: 0.08em;
}

/* ---------- Status ---------- */

#status-node{
  top: 4vh;
  right: clamp(24px, 5vw, 64px);
  text-align: right;
}

.status-line{
  display: flex;
  align-items: center;
  gap: 8px;
  justify-content: flex-end;
  font-size: var(--fs-small);
  color: var(--fg-dim);
  letter-spacing: 0.1em;
}

.dot{
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--amber);
  box-shadow: 0 0 6px var(--amber);
}
.dot.off{ background: var(--red); box-shadow: 0 0 6px var(--red); }

/* ---------- Pesquisa ----------
   Posicionada na altura do olho da personagem (~37vh nesta imagem):
   ela está olhando na direção da busca. Se trocar de wallpaper,
   ajuste este "top" pra linha do olho da nova imagem. */

#search-node{
  top: 36vh;
  left: 76vw;
  width: min(280px, 16vw);
}

#search-form{
  display: flex;
  align-items: center;
  padding: 8px 14px;
  gap: 8px;
}

#search-input{
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--fg);
  font-family: inherit;
  font-size: var(--fs-label);
  letter-spacing: 0.02em;
}
#search-input::placeholder{ color: var(--fg-dim); }

.glyph{
  color: var(--fg-dim);
  font-size: var(--fs-label);
}

/* ---------- Atalhos ----------
   Coluna vertical na faixa vazia à direita do wallpaper (ela olha
   pra cá). Sem caixas: cada atalho é uma linha com um pequeno
   traço à esquerda que acende no foco — como uma listagem de
   terminal, não "6 cards".

   A coluna inteira fica em x = 76vw, e o texto espelhado
   "Close the world, open the next" termina em ~73vw — por isso
   não precisa desviar verticalmente dele, a separação horizontal
   já resolve. */

.shortcut{
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 6px 4px 6px 14px;
  text-decoration: none;
  color: var(--fg-dim);
  border-left: 1px solid rgba(233,230,223,0.16);
  transition: color var(--dur) ease, border-color var(--dur) ease, padding-left var(--dur) ease;
}

.shortcut .label{
  font-size: var(--fs-label);
  letter-spacing: 0.03em;
  color: var(--fg);
}

.shortcut .tag{
  font-size: var(--fs-small);
  color: var(--fg-dim);
  letter-spacing: 0.1em;
}

.shortcut:focus-visible{
  padding-left: 20px;
  border-left: 1px solid var(--amber);
}

/* coluna: mesma posição horizontal, espaçamento vertical regular,
   com o vão reservado pro texto do wallpaper */
#s-classroom{ top: 45vh; left: 76vw; }
#s-discord{   top: 52vh; left: 76vw; }
#s-instagram{ top: 59vh; left: 76vw; }
#s-rewards{   top: 66vh; left: 76vw; }
#s-chatgpt{   top: 73vh; left: 76vw; }
#s-animes{    top: 80vh; left: 76vw; }

/* ---------- Clima ---------- */

#weather-node{
  top: 89vh;
  left: 76vw;
}

#weather{
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: var(--fs-label);
  padding-left: 14px;
}
#w-temp{ font-size: calc(var(--fs-label) * 1.4); color: var(--fg); }
#w-place{ color: var(--fg-dim); letter-spacing: 0.06em; }

/* ---------- Foco (controle / teclado) ----------
   Dois tratamentos diferentes de propósito:
   - a busca tem "panel" (vidro), então o foco nela ganha glow + fundo.
   - os atalhos são linhas soltas (sem caixa), então o foco neles é
     só o traço da esquerda acendendo + leve deslocamento do texto
     (já definido lá em cima, em .shortcut:focus-visible). */

#search-input:focus-visible,
#search-form:focus-within{
  outline: none;
  border-color: var(--amber);
  box-shadow: 0 0 0 1px var(--amber), 0 0 22px var(--focus-glow);
  background: rgba(203, 180, 106, 0.08);
}

/* remove contorno padrão do browser, mantendo o nosso */
:focus{ outline: none; }

/* ---------- Responsivo ---------- */

@media (max-width: 1366px){
  #clock-node, #search-node, .shortcut, #weather-node{ left: 72vw; }
  #search-node{ width: min(260px, 24vw); }
}

@media (max-width: 1280px){
  #clock-node, #search-node, .shortcut, #weather-node{ left: 68vw; }
  #search-node{ width: min(230px, 28vw); }
  :root{ --fs-clock: clamp(20px, 3.6vw, 36px); }
}

@media (min-width: 3000px){
  html, body{ font-size: 1.15em; }
}

/* Fallback: sem backdrop-filter */
@supports not (backdrop-filter: blur(1px)){
  .panel{ background: rgba(15,13,12,0.6); }
}

</style>
</head>
<body>

  <div id="wallpaper-layer"></div>
  <div id="vignette"></div>
  <div id="scanlines"></div>

  <main id="stage">

    <!-- Relógio -->
    <div class="node" id="clock-node">
      <div id="clock">00:00</div>
      <div id="date">--/--/----</div>
    </div>

    <!-- Status -->
    <div class="node" id="status-node">
      <div class="status-line">
        <span class="dot" id="status-dot"></span>
        <span id="status-label">ONLINE</span>
      </div>
    </div>

    <!-- Pesquisa -->
    <div class="node panel" id="search-node">
      <form id="search-form" role="search" aria-label="Pesquisar na web">
        <span class="glyph" aria-hidden="true">›</span>
        <input
          type="text"
          id="search-input"
          placeholder="pesquisar"
          aria-label="Pesquisar na web"
          autocomplete="off"
        >
      </form>
    </div>

    <!-- Atalhos -->
    <a class="node shortcut" id="s-classroom" href="#" aria-label="Abrir Google Classroom">
      <span class="label">Classroom</span>
      <span class="tag">aulas</span>
    </a>

    <a class="node shortcut" id="s-discord" href="#" aria-label="Abrir Discord">
      <span class="label">Discord</span>
      <span class="tag">chat</span>
    </a>

    <a class="node shortcut" id="s-instagram" href="#" aria-label="Abrir Instagram">
      <span class="label">Instagram</span>
      <span class="tag">social</span>
    </a>

    <a class="node shortcut" id="s-rewards" href="#" aria-label="Abrir Microsoft Rewards">
      <span class="label">Rewards</span>
      <span class="tag">pontos</span>
    </a>

    <a class="node shortcut" id="s-chatgpt" href="#" aria-label="Abrir ChatGPT">
      <span class="label">ChatGPT</span>
      <span class="tag">ia</span>
    </a>

    <a class="node shortcut" id="s-animes" href="#" aria-label="Abrir Sushi Animes">
      <span class="label">Animes</span>
      <span class="tag">streaming</span>
    </a>

    <!-- Clima -->
    <div class="node" id="weather-node">
      <div id="weather">
        <span id="w-temp">--°C</span>
        <span id="w-place">--</span>
      </div>
    </div>

  </main>

/* ---------------- Wallpaper ---------------- */

function applyWallpaper(){
  const layer = document.getElementById("wallpaper-layer");
  if (!WALLPAPER_URL) return;

  // pré-carrega antes de aplicar, pra evitar "flash" de fundo preto/errado
  const img = new Image();
  img.onload = () => {
    layer.style.setProperty("--wallpaper-url", `url("${WALLPAPER_URL}")`);
  };
  img.onerror = () => {
    // mantém fundo escuro sólido se a imagem falhar — nunca quebra o layout
    console.warn("[dashboard] wallpaper não carregou:", WALLPAPER_URL);
  };
  img.src = WALLPAPER_URL;
}


/* ---------------- Relógio ---------------- */

function startClock(){
  const clockEl = document.getElementById("clock");
  const dateEl = document.getElementById("date");

  function tick(){
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, "0");
    const mm = String(now.getMinutes()).padStart(2, "0");
    clockEl.textContent = `${hh}:${mm}`;

    const dd = String(now.getDate()).padStart(2, "0");
    const mo = String(now.getMonth() + 1).padStart(2, "0");
    const yy = now.getFullYear();
    dateEl.textContent = `${dd}/${mo}/${yy}`;
  }

  tick();
  // alinha o próximo tick ao início do minuto seguinte, depois repete a cada 60s
  const msToNextMinute = 60000 - (Date.now() % 60000);
  setTimeout(() => {
    tick();
    setInterval(tick, 60000);
  }, msToNextMinute);
}


/* ---------------- Clima (Open-Meteo, sem chave de API) ---------------- */

const WEATHER_CACHE_KEY = "dashboard_weather_cache_v1";
const WEATHER_CACHE_MS = 15 * 60 * 1000; // 15 minutos

async function loadWeather(){
  const tempEl = document.getElementById("w-temp");
  const placeEl = document.getElementById("w-place");
  placeEl.textContent = WEATHER_CONFIG.city;

  try{
    const cached = readWeatherCache();
    if (cached){
      renderWeather(cached.temp);
      return;
    }

    const coords = await geocodeCity(WEATHER_CONFIG.city, WEATHER_CONFIG.country);
    if (!coords) throw new Error("geocoding falhou");

    const temp = await fetchCurrentTemp(coords.latitude, coords.longitude);
    if (temp === null) throw new Error("forecast falhou");

    renderWeather(temp);
    writeWeatherCache(temp);
  }catch(err){
    console.warn("[dashboard] clima indisponível:", err.message);
    tempEl.textContent = "--°C";
  }
}

function renderWeather(temp){
  document.getElementById("w-temp").textContent = `${Math.round(temp)}°C`;
}

function readWeatherCache(){
  try{
    const raw = localStorage.getItem(WEATHER_CACHE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (Date.now() - data.ts > WEATHER_CACHE_MS) return null;
    return data;
  }catch{
    return null;
  }
}

function writeWeatherCache(temp){
  try{
    localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify({ temp, ts: Date.now() }));
  }catch{ /* localStorage indisponível — segue sem cache */ }
}

async function geocodeCity(city, country){
  const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=5&language=pt&format=json`;
  const res = await fetch(url);
  if (!res.ok) return null;
  const data = await res.json();
  if (!data.results || !data.results.length) return null;

  const match = data.results.find(r => r.country_code === country) || data.results[0];
  return { latitude: match.latitude, longitude: match.longitude };
}

async function fetchCurrentTemp(lat, lon){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m`;
  const res = await fetch(url);
  if (!res.ok) return null;
  const data = await res.json();
  if (!data.current || typeof data.current.temperature_2m !== "number") return null;
  return data.current.temperature_2m;
}

function setupSearch(){

  form.addEventListener("submit", (e) => {

    window.location.href = url;

}

document.addEventListener("DOMContentLoaded", () => {

/* ---------------- Navegação espacial (setas / D-pad) ---------------- */

function getFocusables(){
  return Array.from(document.querySelectorAll(
    'a.shortcut, #search-input'
  ));
}

function setupSpatialNavigation(){
  document.addEventListener("keydown", (e) => {
    const keys = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"];
    if (!keys.includes(e.key)) return;

    // dentro do campo de busca, não intercepta as setas (edição de texto)
    if (document.activeElement && document.activeElement.id === "search-input") return;

    e.preventDefault();
    moveFocus(e.key.replace("Arrow", "").toLowerCase());
  });
}

function moveFocus(direction){
  const focusables = getFocusables();
  const current = document.activeElement;
  const currentRect = focusables.includes(current)
    ? current.getBoundingClientRect()
    : { left: 0, top: 0, right: 0, bottom: 0, width: 0, height: 0 };

  const cx = currentRect.left + currentRect.width / 2;
  const cy = currentRect.top + currentRect.height / 2;

  let best = null;
  let bestScore = Infinity;

  for (const el of focusables){
    if (el === current) continue;
    const rect = el.getBoundingClientRect();
    const ex = rect.left + rect.width / 2;
    const ey = rect.top + rect.height / 2;
    const dx = ex - cx;
    const dy = ey - cy;

    let inDirection = false;
    let primary = 0, secondary = 0;

    if (direction === "right" && dx > 4){ inDirection = true; primary = dx; secondary = Math.abs(dy); }
    if (direction === "left"  && dx < -4){ inDirection = true; primary = -dx; secondary = Math.abs(dy); }
    if (direction === "down"  && dy > 4){ inDirection = true; primary = dy; secondary = Math.abs(dx); }
    if (direction === "up"    && dy < -4){ inDirection = true; primary = -dy; secondary = Math.abs(dx); }

    if (!inDirection) continue;

    // prioriza proximidade no eixo principal, penaliza desvio lateral
    const score = primary + secondary * 1.6;
    if (score < bestScore){
      bestScore = score;
      best = el;
    }
  }

  if (best) best.focus({ preventScroll: true });
}


/* ---------------- Suporte a controle Xbox (Gamepad API) ---------------- */

function setupGamepad(){
  let lastMoveAt = 0;
  const REPEAT_MS = 190;
  let prevButtons = [];

  function poll(){
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    const pad = pads && pads[0];

    if (pad){
      const now = performance.now();
      const [lx, ly] = [pad.axes[0] || 0, pad.axes[1] || 0];
      const dpadUp = pad.buttons[12] && pad.buttons[12].pressed;
      const dpadDown = pad.buttons[13] && pad.buttons[13].pressed;
      const dpadLeft = pad.buttons[14] && pad.buttons[14].pressed;
      const dpadRight = pad.buttons[15] && pad.buttons[15].pressed;

      const stickThreshold = 0.5;
      let dir = null;
      if (dpadUp || ly < -stickThreshold) dir = "up";
      else if (dpadDown || ly > stickThreshold) dir = "down";
      else if (dpadLeft || lx < -stickThreshold) dir = "left";
      else if (dpadRight || lx > stickThreshold) dir = "right";

      if (dir && now - lastMoveAt > REPEAT_MS){
        moveFocus(dir);
        lastMoveAt = now;
      }

      const aPressed = pad.buttons[0] && pad.buttons[0].pressed;
      const bPressed = pad.buttons[1] && pad.buttons[1].pressed;
      const wasA = prevButtons[0];
      const wasB = prevButtons[1];

      if (aPressed && !wasA){
        const active = document.activeElement;
        if (active && active.tagName === "A") active.click();
      }
      if (bPressed && !wasB){
        const active = document.activeElement;
        if (active && active.id === "search-input") active.blur();
      }

      prevButtons = pad.buttons.map(b => b.pressed);
    }

    requestAnimationFrame(poll);
  }

  window.addEventListener("gamepadconnected", () => {
    requestAnimationFrame(poll);
  });
}


/* ---------------- Status online/offline ---------------- */

function markOnlineStatus(){
  const dot = document.getElementById("status-dot");
  const label = document.getElementById("status-label");

  function update(){
    const online = navigator.onLine;
    dot.classList.toggle("off", !online);
    label.textContent = online ? "ONLINE" : "OFFLINE";
  }

  update();
  window.addEventListener("online", update);
  window.addEventListener("offline", update);
}

</script>
